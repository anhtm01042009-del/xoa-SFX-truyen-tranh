# Dong goi app Xoa chu truyen tranh bang PyInstaller cho Windows va Mac (chip Apple M1 tro len).
# - Moi lan day len nhanh main (co doi code/goi): tao file zip de tai thu (muc Actions > Artifacts).
# - Khi tao ban phat hanh voi nhan phien ban (vd v0.1.1): ca hai file zip duoc dinh kem o muc Releases.
# Mo hinh AI KHONG nam trong zip: app tu tai lan dau mo.
name: Dong goi zip

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "assets/**"
      - "packaging/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien (torch ban CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r packaging/requirements-dong-goi.txt

      - name: Kiem tra ma nguon nap duoc
        run: python packaging/kiem_tra_nap.py

      - name: Dong goi
        run: pyinstaller --noconfirm packaging/XoaChuTruyenTranh.spec

      - name: Chay thu ban dong goi (tai mo hinh, xoa chu tren trang gia, khong mo cua so)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SSL_CERT_FILE: C:/khong-co-chung-chi.pem   # gia lap may khong co chung chi cho OpenSSL
        run: |
          $p = Start-Process dist/XoaChuTruyenTranh/XoaChuTruyenTranh.exe -ArgumentList "--tu-kiem-tra","--day-du" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/XoaChuTruyenTranh/nhat-ky-loi.txt" -ErrorAction SilentlyContinue
            Write-Error "Ban dong goi tu kiem tra loi (ma $($p.ExitCode))"; exit 1
          }
          Get-ChildItem "$env:LOCALAPPDATA/XoaChuTruyenTranh/models" | Format-Table Name, Length

      - name: Nen zip
        shell: pwsh
        run: |
          Copy-Item packaging/DOC-TRUOC.txt dist/XoaChuTruyenTranh/
          7z a -tzip -mx=5 XoaChuTruyenTranh-windows.zip ./dist/XoaChuTruyenTranh
          $f = Get-Item XoaChuTruyenTranh-windows.zip
          "XoaChuTruyenTranh-windows.zip: {0:N0} MB" -f ($f.Length / 1MB)
          $d = (Get-ChildItem dist/XoaChuTruyenTranh -Recurse | Measure-Object Length -Sum).Sum
          "Sau khi giai nen: {0:N0} MB" -f ($d / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: XoaChuTruyenTranh-windows
          path: XoaChuTruyenTranh-windows.zip
          compression-level: 0

      - name: Dinh kem vao ban phat hanh
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: XoaChuTruyenTranh-windows.zip
          body_path: packaging/MO-TA-BAN-PHAT-HANH.md

  mac:
    runs-on: macos-latest   # chip Apple (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install torch
          pip install -r packaging/requirements-dong-goi.txt

      - name: Kiem tra ma nguon nap duoc
        run: python packaging/kiem_tra_nap.py

      - name: Dong goi
        run: |
          pyinstaller --noconfirm packaging/XoaChuTruyenTranh.spec
          codesign --verify --verbose=2 dist/XoaChuTruyenTranh.app

      - name: Chay thu ban dong goi (tai mo hinh, xoa chu tren trang gia, khong mo cua so)
        env:
          QT_QPA_PLATFORM: offscreen
          # Gia lap Mac cua nguoi dung: OpenSSL trong app khong thay chung chi nao (loi CERTIFICATE_VERIFY_FAILED
          # 2026-11-20). App phai tu tai duoc nho certifi dong goi kem.
          SSL_CERT_FILE: /khong-co-chung-chi.pem
          SSL_CERT_DIR: /khong-co-thu-muc
        run: |
          DATA="$HOME/Library/Application Support/XoaChuTruyenTranh"
          if ! dist/XoaChuTruyenTranh.app/Contents/MacOS/XoaChuTruyenTranh --tu-kiem-tra --day-du; then
            cat "$DATA/nhat-ky-loi.txt" || true
            echo "::error::Ban dong goi Mac tu kiem tra loi"; exit 1
          fi
          ls -l "$DATA/models"
          codesign -dv dist/XoaChuTruyenTranh.app 2>&1 | head -5 || true

      - name: Nen zip (giu lien ket ben trong app)
        run: |
          mkdir -p goi/XoaChuTruyenTranh
          cp -R dist/XoaChuTruyenTranh.app goi/XoaChuTruyenTranh/
          cp packaging/DOC-TRUOC-MAC.txt goi/XoaChuTruyenTranh/DOC-TRUOC.txt
          ditto -c -k --sequesterRsrc --keepParent goi/XoaChuTruyenTranh XoaChuTruyenTranh-mac.zip
          echo "XoaChuTruyenTranh-mac.zip: $(( $(stat -f%z XoaChuTruyenTranh-mac.zip) / 1048576 )) MB"
          echo "Sau khi giai nen: $(du -sm goi/XoaChuTruyenTranh | cut -f1) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: XoaChuTruyenTranh-mac
          path: XoaChuTruyenTranh-mac.zip
          compression-level: 0

      - name: Dinh kem vao ban phat hanh
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: XoaChuTruyenTranh-mac.zip
          body_path: packaging/MO-TA-BAN-PHAT-HANH.md
