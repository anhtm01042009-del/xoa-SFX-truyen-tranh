# Tam thoi: do loi nap cv2 trong ban Mac. Xoa sau khi sua xong.
name: Tam kiem tra Mac
on: workflow_dispatch
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install torch
          pip install -r packaging/requirements-dong-goi.txt
          pip list | grep -i -E "opencv|pyinstaller"
      - run: pyinstaller --noconfirm packaging/XoaChuTruyenTranh.spec
      - name: Ruot cv2
        run: |
          echo "== onedir"; find dist/XoaChuTruyenTranh -maxdepth 3 -path "*cv2*" | head -30
          echo "== app"; find dist/XoaChuTruyenTranh.app -path "*cv2*" -maxdepth 5 -exec ls -ld {} \; | head -40
          cat dist/XoaChuTruyenTranh.app/Contents/Frameworks/cv2/config*.py || true
          cat dist/XoaChuTruyenTranh.app/Contents/Resources/cv2/config*.py || true
      - name: Thu onedir (khong .app)
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/XoaChuTruyenTranh/XoaChuTruyenTranh --tu-kiem-tra 2>&1 | tail -5 || true
